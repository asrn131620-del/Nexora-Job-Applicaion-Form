services:
  - type: web
    name: nexora-job-application-portal
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn run:app

    envVars:
      - key: SECRET_KEY
        sync: false

      - key: FOUNDER_USERNAME
        sync: false

      - key: FOUNDER_PASSWORD
        sync: false

      - key: DATABASE_PATH
        value: /opt/render/project/src/instance/nexora.sqlite3

      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads

      - key: MAX_CONTENT_MB
        value: "10"
